name: TG Multi-Category Scraper Pipeline

on:
  workflow_dispatch:
  # Uncomment to run automatically (cron is in UTC; this is 10:00 AM IST daily):
  # schedule:
  #   - cron: "30 4 * * *"

# Needed so the job can push the updated CSV back to the repository.
permissions:
  contents: write

# Never run two pipelines at once (avoids CSV push conflicts and double alerts).
concurrency:
  group: tg-scraper-pipeline
  cancel-in-progress: false

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas pytz

      - name: Run lead scraper
        id: scrape
        # Keep going on failure so any leads already saved still get committed.
        continue-on-error: true
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_CHAT_ID }}
        run: python tg_multi_scraper.py

      - name: Commit and push updated leads CSV
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          if [ ! -f Axiomate_Leads.csv ]; then
            echo "No Axiomate_Leads.csv produced; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Axiomate_Leads.csv

          if git diff --cached --quiet; then
            echo "No new leads to commit."
            exit 0
          fi

          git commit -m "Auto-update verified leads CSV [skip ci]"
          # Pick up any commits pushed while the scraper was running, then push.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail the job if the scraper failed
        if: ${{ steps.scrape.outcome == 'failure' }}
        run: |
          echo "tg_multi_scraper.py exited with an error (see 'Run lead scraper' step and the Telegram alert)."
          exit 1
