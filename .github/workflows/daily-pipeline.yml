name: Daily Axiomate Leads Automation Pipeline

on:
  schedule:
    # 08:55 AM IST = 03:25 AM UTC (08:55 - 5:30 = 03:25 UTC)
    - cron: '25 3 * * *'
  workflow_dispatch: # Allows manual run button directly from GitHub Actions tab

jobs:
  run-scraper-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Multi-Category Scraper Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python multi_scraper.py

      - name: Commit and Push Updated CSV File to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Axiomate_Leads.csv
          git commit -m "Auto-update fresh leads with IST timestamp [skip ci]" || echo "No changes to commit"
          git push
