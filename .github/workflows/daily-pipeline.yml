name: Daily Multi-Category Scraper Pipeline

on:
  schedule:
    - cron: '30 0 * * *'  # Daily at 06:00 AM IST
  workflow_dispatch:      # Enables manual trigger button

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Execute Multi-Category Scraper Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python multi_scraper.py

      - name: Commit and Push Updated CSV and History to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Axiomate_Leads.csv leads_history.json
          git commit -m "Auto-update fresh unique leads with history tracking [skip ci]" || echo "No changes to commit"
          git push
