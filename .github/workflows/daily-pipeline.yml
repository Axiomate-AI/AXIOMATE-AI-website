name: Axiomate AI Production Pipeline

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily
  workflow_dispatch:      # Allows manual trigger

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Multi-Niche Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python multi_scraper.py

      - name: Commit and Push CSV Leads
        run: |
          git config --global user.name "Axiomate Bot"
          git config --global user.email "bot@axiomate.ai"
          git add Axiomate_Leads.csv
          git commit -m "Auto-update leads CSV [skip ci]" || exit 0
          git push
