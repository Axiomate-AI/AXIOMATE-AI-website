name: WA Scheduled Sender Workflow

on:
  schedule:
    - cron: '30 4 * * 1-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wa-script:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run WhatsApp Script
        env:
          GREEN_API_ID_INSTANCE: ${{ secrets.GREEN_API_ID_INSTANCE }}
          GREEN_API_TOKEN_INSTANCE: ${{ secrets.GREEN_API_TOKEN_INSTANCE }}
        run: python wa_sender_script.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leads_history.json
          git commit -m "Auto-update sent leads history [skip ci]" || echo "No changes to commit"
          git push
